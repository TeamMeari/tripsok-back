version: '3.8'
services:
  backend-service:
    build:
      context: ./back/tripsok_back
      dockerfile: Dockerfile
    image: local/backend-service:${IMAGE_TAG:-local}
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "18081:8080"
  nginx-service:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    image: local/nginx-service:${IMAGE_TAG:-local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/cert:/etc/nginx/ssl
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "${ELASTIC_PORT}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTIC_URL}
      - ELASTICSEARCH_USERNAME=${ELASTIC_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      - elasticsearch

  redis-service:
    build:
      context: ./infra/redis
      dockerfile: Dockerfile
    image: local/redis-service:${IMAGE_TAG:-local}
    ports:
      - "6379:6379"
    command: [ "redis-server", "--requirepass", "redisPw" ]
  database-service:
    build:
      context: ./infra/rdbms
      dockerfile: Dockerfile
    image: local/database-service:${IMAGE_TAG:-local}
    environment:
      MYSQL_ROOT_PASSWORD: tripsokPW
      MYSQL_DATABASE: tripsokDB
      MYSQL_USER: tripsok
      MYSQL_PASSWORD: tripsokUPW
    ports:
      - "3307:3306"
volumes:
  es_data: